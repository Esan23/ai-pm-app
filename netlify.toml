[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Node 22: supabase-js in Netlify Functions needs native WebSocket (>=22).
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback — single-page app, all routes serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
